<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#favGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Neural Network / Code Node icon -->
  <circle cx="20" cy="22" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="44" cy="22" r="5" fill="#6366f1" filter="url(#glow)"/>
  <circle cx="32" cy="42" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="20" y1="22" x2="32" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="2 2"/>
  <line x1="44" y1="22" x2="32" y2="42" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="2 2"/>
  <line x1="20" y1="22" x2="44" y2="22" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
</svg>
