<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e32"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="200" cy="200" r="180" fill="url(#heroGlow)"/>

  <!-- Tech Circles / Orbit Rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 8"/>

  <!-- Outer Hexagonal/Circular Base -->
  <circle cx="200" cy="200" r="130" fill="url(#cardBg)" stroke="url(#cyberBorder)" stroke-width="3"/>

  <!-- Neural Network Constellation Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="140" y1="120" x2="200" y2="90"/>
    <line x1="200" y1="90" x2="260" y2="120"/>
    <line x1="140" y1="120" x2="130" y2="180"/>
    <line x1="260" y1="120" x2="270" y2="180"/>
    <line x1="130" y1="180" x2="200" y2="160"/>
    <line x1="270" y1="180" x2="200" y2="160"/>
    <line x1="200" y1="90" x2="200" y2="160"/>
  </g>

  <!-- Constellation Nodes (AI Nodes) -->
  <circle cx="200" cy="90" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="140" cy="120" r="4" fill="#818cf8"/>
  <circle cx="260" cy="120" r="4" fill="#818cf8"/>
  <circle cx="130" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="270" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="200" cy="160" r="5" fill="#a855f7" filter="url(#softGlow)"/>

  <!-- Developer Silhouette / Portrait Base -->
  <!-- Shoulders & Torso -->
  <path d="M120 320 C120 260 150 240 200 240 C250 240 280 260 280 320 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M145 320 L180 265 L220 265 L255 320 Z" fill="#0f172a" opacity="0.6"/>
  <!-- Hoodie / Collar Accent -->
  <path d="M185 240 L200 265 L215 240" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="188" y="215" width="24" height="30" rx="6" fill="#334155"/>

  <!-- Head / Face Silhouette -->
  <circle cx="200" cy="185" r="38" fill="#334155"/>
  <ellipse cx="200" cy="180" rx="36" ry="34" fill="#1e293b"/>

  <!-- Stylized Hair -->
  <path d="M165 180 C165 145 180 140 200 140 C225 140 236 150 236 175 C236 178 220 165 200 165 C180 165 170 174 165 180 Z" fill="#0f172a"/>

  <!-- Futuristic Cyber Glasses / HUD Visor -->
  <path d="M172 178 C180 176 195 176 200 178 C205 176 220 176 228 178 C232 186 225 194 204 194 C196 194 180 194 168 186 Z" fill="url(#codeGrad)" filter="url(#softGlow)" opacity="0.95"/>
  <line x1="172" y1="184" x2="228" y2="184" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Floating Code & Tech Badges -->
  <!-- Top Left: <AI /> Badge -->
  <g transform="translate(45, 110)">
    <rect width="84" height="34" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="42" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">&lt;AI / ML&gt;</text>
  </g>

  <!-- Top Right: Python/Code Badge -->
  <g transform="translate(275, 110)">
    <rect width="80" height="34" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="40" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle">{ B.Tech }</text>
  </g>

  <!-- Bottom Badge: Semester 3 -->
  <g transform="translate(130, 315)">
    <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="148" cy="332" r="4" fill="#10b981"/>
    <text x="204" y="337" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Sem 3 • CS (AIML)</text>
  </g>

  <!-- Sparkling particle dots -->
  <circle cx="95" cy="220" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="310" cy="240" r="2.5" fill="#818cf8" opacity="0.7"/>
  <circle cx="210" cy="50" r="3" fill="#38bdf8" filter="url(#softGlow)"/>
</svg>
